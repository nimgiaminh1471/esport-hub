name = "esports-hub-slack"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Sửa thành URL GitHub Pages thật của bạn, không có dấu / ở cuối.
[vars]
PAGES_BASE_URL = "https://nimgiaminh1471.github.io/esport-hub"
# ID kênh nhận tổng kết cuối ngày (bấm tên kênh -> cuối popup có Channel ID).
SLACK_CHANNEL_ID = "C0BQT1HPY10"
# Phần của đối tác trong lãi mỗi ngày, 0–1. Đổi ở đây là áp cho các ngày CHỐT TỪ
# ĐÂY VỀ SAU; ngày đã chốt giữ nguyên tỉ lệ đã lưu trong chính dòng đó.
DOI_TAC_SHARE = "0.5"

# Kho dữ liệu cho sổ ghi chú. Tạo một lần rồi dán id vào đây:
#   npx wrangler kv namespace create NOTE
# Dữ liệu nằm trong tài khoản Cloudflare, KHÔNG nằm trong repo.
[[kv_namespaces]]
binding = "NOTE"
id = "5e0f78a137764c9bb1718d02811bab9a"

# Các secret KHÔNG đặt ở đây. Nạp từng cái bằng `npx wrangler secret put <TÊN>`:
#   SLACK_SIGNING_SECRET   xác thực slash command
#   SLACK_BOT_TOKEN        để `/note chot` đăng tổng kết vào kênh (scope chat:write)
# Khi chạy `wrangler dev`, đặt trong worker/.dev.vars (file này đã bị .gitignore).
